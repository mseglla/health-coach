<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IndexedDB migration test</title>
</head>
<body>
  <pre id="results">Executant proves...</pre>

  <script type="module">
    const output = document.querySelector('#results');
    const databaseName = 'atles-local';
    const storageKey = 'healthCoachV3';
    const messages = [];

    function assert(condition, message) {
      if (!condition) throw new Error(message);
      messages.push(`PASS — ${message}`);
    }

    function deleteDatabase(name) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.deleteDatabase(name);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(
          request.error || new Error('No s’ha pogut eliminar la base de prova')
        );
        request.onblocked = () => reject(
          new Error('L’eliminació de la base ha quedat bloquejada')
        );
      });
    }

    let storageAdapter;

    try {
      await deleteDatabase(databaseName);
      localStorage.removeItem(storageKey);
      localStorage.removeItem('healthCoachV2');
      localStorage.removeItem('healthCoachMvpV1');

      const seededState = {
        version: 3,
        settings: {
          name: 'Migration test',
          age: 35,
          height: 176.5,
          sex: 'male',
          goal: 75,
          targetDate: '2026-12-31'
        },
        days: [],
        weights: [{
          id: 'migration-weight',
          value: 79.9,
          measuredAt: '2026-07-25T08:00',
          createdAt: '2026-07-25T08:00:00.000Z'
        }]
      };

      localStorage.setItem(storageKey, JSON.stringify(seededState));

      const storageModule = await import(
        `../js/storage.js?test=${crypto.randomUUID()}`
      );

      storageAdapter = storageModule.storageAdapter;
      const state = await storageModule.storageService.loadState();

      assert(
        state.weights[0].value === 79.9,
        'carrega les dades existents de localStorage'
      );

      const indexedRaw = await storageAdapter.primary.getItem(storageKey);

      assert(
        JSON.parse(indexedRaw).weights[0].value === 79.9,
        'copia automàticament les dades a IndexedDB'
      );

      state.weights[0].value = 79.8;
      await storageModule.storageService.persistState(state);

      const indexedUpdated = JSON.parse(
        await storageAdapter.primary.getItem(storageKey)
      );

      const fallbackUpdated = JSON.parse(
        localStorage.getItem(storageKey)
      );

      assert(
        indexedUpdated.weights[0].value === 79.8,
        'actualitza IndexedDB'
      );

      assert(
        fallbackUpdated.weights[0].value === 79.8,
        'manté actualitzada la còpia de localStorage'
      );

      const status = storageAdapter.getStatus();

      assert(
        status.primaryAvailable && status.fallbackAvailable,
        'els dos sistemes queden disponibles'
      );

      await storageAdapter.primary.close();
      await deleteDatabase(databaseName);
      localStorage.removeItem(storageKey);

      messages.push('PASS — elimina totes les dades de prova');
      output.textContent = messages.join('\n');
    } catch (error) {
      try {
        await storageAdapter?.primary?.close();
        await deleteDatabase(databaseName);
      } catch {}

      localStorage.removeItem(storageKey);
      output.textContent = `${messages.join('\n')}\nFAIL — ${error.message}`;
      throw error;
    }
  </script>
</body>
</html>
